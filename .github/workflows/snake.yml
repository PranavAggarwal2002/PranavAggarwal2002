name: GitHub Snake Game

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:
push:
branches:
- main

jobs:
generate:
runs-on: ubuntu-latest
timeout-minutes: 10

```
permissions:
  contents: write

steps:
  - name: Generate Snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: ${{ github.repository_owner }}
      outputs: |
        dist/github-snake.svg?color_snake=#2563eb
        dist/github-snake-dark.svg?palette=github-dark&color_snake=#2563eb
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - name: Publish to Output Branch
    uses: crazy-max/ghaction-github-pages@v4
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

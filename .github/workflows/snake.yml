name: Generate Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

jobs:
generate:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - name: Generate contribution snake
    uses: Platane/snk@v3
    with:
      github_user_name: PranavAggarwal2002
      outputs: |
        dist/github-snake.svg
        dist/github-snake-dark.svg?palette=github-dark

  - name: Publish snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DIR: dist
```

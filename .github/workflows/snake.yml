name: GitHub Snake Game

on:

# Schedule the workflow to run daily at midnight UTC

schedule:
- cron: "0 0 * * *"

# Allow manual triggering of the workflow

workflow_dispatch:

# Trigger the workflow on pushes to the main branch

push:
branches:
- main

jobs:
generate:
runs-on: ubuntu-latest
timeout-minutes: 10

```
steps:
  # Step 1: Checkout the repository
  - name: Checkout Repository
    uses: actions/checkout@v3

  # Step 2: Generate the snake animations
  - name: Generate GitHub Contributions Snake Animations
    uses: Platane/snk@v3
    with:
      # Your GitHub username
      github_user_name: PranavAggarwal2002

      # Define the output files and their configurations
      outputs: |
        dist/github-snake.svg?color_snake=#2563eb
        dist/github-snake-dark.svg?palette=github-dark&color_snake=#2563eb
        dist/ocean.gif?color_snake=#2563eb&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 3: Slow the animation down
  - name: Slow Down Snake Animation
    run: |
      SLOWDOWN=2
      for f in dist/github-snake.svg dist/github-snake-dark.svg; do
        if [ -f "$f" ]; then
          perl -pi -e "s/(\d+)ms/int(\$1*${SLOWDOWN}).'ms'/ge" "$f"
        fi
      done

  # Step 4: Deploy the generated files to the output branch
  - name: Deploy to Output Branch
    uses: peaceiris/actions-gh-pages@v3
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./dist
      publish_branch: output
      commit_message: "Update snake animation [skip ci]"
